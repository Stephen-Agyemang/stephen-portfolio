    <!-- Google tag (gtag.js) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-YM0S6YT9E6');

      // gtag.js is 175 KB compressed, more JavaScript than the whole site, and
      // an `async` tag still downloads and runs it in the middle of the first
      // render, where a phone needs the bandwidth and the main thread for the
      // page itself. So it waits for the load event, then for idle. The calls
      // above just queue in dataLayer and are sent once it arrives; the cost is
      // missing a visitor who leaves within the first couple of seconds.
      window.addEventListener('load', function () {
        var idle = window.requestIdleCallback || function (fn) { return setTimeout(fn, 1500); };
        idle(function () {
          var tag = document.createElement('script');
          tag.async = true;
          tag.src = 'https://www.googletagmanager.com/gtag/js?id=G-YM0S6YT9E6';
          document.head.appendChild(tag);
        }, { timeout: 4000 });
      }, { once: true });
    </script>
    <script>
      // Opt out of the browser restoring a previous scroll position on reload.
      // Inline and in <head> so it applies before the first paint, which the
      // equivalent line in App.jsx cannot do.
      //
      // There is deliberately no scrollTo(0, 0) here. It used to follow, and it
      // ran on every load — including loads that carried a #hash — so arriving
      // at /#projects scrolled straight back to the top. Opting out of restore
      // is already enough to land at the top on an ordinary reload.
      if (history.scrollRestoration) {
        history.scrollRestoration = 'manual';
      }
    </script>
